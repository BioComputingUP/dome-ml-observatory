# nginx config for the observatory-ui image: SPA fallback, gzip, security headers, and a
# same-origin proxy to the backend so the two containers never need CORS or a third connector
# between them. See observatory-ui/Dockerfile's header for the full rationale.

server {
  listen 80;

  # Don't advertise the nginx version in the Server header.
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Same-origin API access: the browser only ever talks to this origin. nginx forwards to the
  # backend container over the Docker Compose network by its service name.
  #
  # The upstream is a variable, not a bare hostname, and on purpose: a plain
  # `proxy_pass http://observatory-ws:3000/api/;` makes nginx resolve that hostname once at
  # config-LOAD time -- and if it can't (observatory-ws doesn't exist as a container until
  # Phase 6, and isn't running at all when this image is started standalone), nginx refuses to
  # start at all. Confirmed the hard way: `nginx: [emerg] host not found in upstream
  # "observatory-ws"` crash-looped the whole container, not just this route, when tested without
  # a backend present. Routing through $backend + `resolver` defers DNS lookup to REQUEST time
  # instead, via Docker's embedded DNS at 127.0.0.11 (available on any container attached to a
  # Compose-created network) -- nginx now starts fine with no backend present, and only a request
  # to /api/* fails (502/504), not the container. If frontend and backend are ever split across
  # separate hosts, replace $backend's value with nginx:alpine's built-in envsubst templating
  # (/etc/nginx/templates/*.template -> conf.d/, values from container env vars) rather than
  # editing this file by hand per environment.
  # resolver_timeout kept short deliberately: nginx's own default (30s) means a request to
  # /api/* would otherwise hang for 30+ seconds before failing when the backend is unreachable --
  # confirmed by testing (curl hit its own 15s --max-time first and still hadn't gotten an
  # answer). 5s fails fast instead, which matters even in the working, backend-present case: it
  # bounds how long a real outage or DNS hiccup can hang a client request for.
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  location /api/ {
    set $backend "observatory-ws:3000";
    # $request_uri, not a URI on proxy_pass -- found live in Phase 6 verification: when
    # proxy_pass's target is a variable (required above so nginx can start with no backend
    # present), nginx does NOT do its usual location-prefix substitution. It forwards the literal
    # proxy_pass URI as-is and drops the rest of the client's path/query entirely -- a request for
    # /api/records?pageSize=1 arrived at the backend as a bare GET /api/, 404ing on every route
    # with a real segment. $request_uri (the original, unmodified request URI) sidesteps the
    # substitution machinery altogether and is exactly correct here since this location's prefix
    # (/api/) already matches the backend's own global prefix -- no rewriting is actually needed.
    proxy_pass http://$backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No add_header here on purpose. The backend sets its own security headers via helmet
    # (see observatory-ws/src/main.ts), and adding a second set from nginx emits BOTH -- verified
    # live: X-Frame-Options came back as SAMEORIGIN *and* DENY, which browsers resolve
    # inconsistently and may ignore altogether. One owner per header; for /api/ that owner is
    # helmet, which also knows to leave Swagger UI at /api/docs renderable.
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;

    # Security headers for the app itself. Deliberately NOT declared at server level: nginx's
    # add_header does not merge across levels -- a nested block that sets any header drops every
    # one inherited from its parent -- so each location that needs headers declares its own set.
    #
    # The CSP is tight because it can be: the SPA loads no third-party style or font, and exactly
    # one third-party script. Fonts are self-hosted (see src/_fonts.scss and src/_ebi-icons.scss)
    # precisely so font-src can stay 'self'. Four relaxations are load-bearing:
    #   style-src 'unsafe-inline' -- Angular writes component styles and a handful of inline
    #     style attributes at runtime; without it the app renders unstyled.
    #   img-src data: -- inlined SVG/PNG data URIs from the build.
    #   script-src + connect-src + img-src matomo.biocomputingup.it -- the lab's self-hosted
    #     Matomo, the ONE third-party origin this site contacts. All three are needed: the tracker
    #     script itself, the XHR it reports hits with, and its no-JS tracking-pixel fallback.
    #     Listed here even while tracking is switched off (analytics.config.ts ships
    #     MATOMO_SITE_ID = null, so nothing loads) so that flipping the site ID on does not also
    #     require a container rebuild to stop the CSP blocking it silently. Nothing loads from a
    #     host merely because the CSP would permit it.
    # connect-src is otherwise 'self', which is what confines the API to the same origin, matching
    # the SPA's relative-URL-only design. frame-ancestors 'none' blocks clickjacking;
    # X-Frame-Options is the same intent for older browsers that ignore frame-ancestors.
    #
    # NOTE: a CSP violation is silent in the container and absent under `ng serve`, which has no
    # CSP at all -- so any change here has to be checked in a real browser against the containerised
    # site, never the dev server. See AGENTS.md.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.biocomputingup.it; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://matomo.biocomputingup.it; font-src 'self'; connect-src 'self' https://matomo.biocomputingup.it; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Opt out of the legacy interest-cohort/topics APIs and hardware access nothing here uses.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS is commented out on purpose: this container listens on plain HTTP and TLS is
    # terminated in front of it. Whoever terminates TLS should send this, and sending it from
    # here would apply it to a plain-HTTP local stack too. Uncomment only if this container is
    # ever the TLS endpoint.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
