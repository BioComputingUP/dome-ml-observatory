<div class="container-fluid">
  <nav class="navbar navbar-expand-xl navbar-light">
    <a routerLink="/" class="navbar-brand" title="DOME Observatory home">
      <img alt="DOME Observatory" src="assets/img/observatory_logo.svg" class="brand-img img-fluid" />
    </a>
    <button
      class="navbar-toggler"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="!isCollapsed"
      (click)="isCollapsed = !isCollapsed"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="!isCollapsed">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="search"
            title="Search & browse"
            (click)="collapseNav()"
            >Search</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="download"
            title="Bulk download"
            (click)="collapseNav()"
            >Download</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="api"
            title="API & documentation"
            (click)="collapseNav()"
            >API</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="integrations"
            title="Integrations & standards"
            (click)="collapseNav()"
            >Integrations</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="about"
            title="About"
            (click)="collapseNav()"
            >About</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-item nav-link btn-navbar"
            routerLinkActive="active"
            routerLink="news"
            title="News & Events"
            (click)="collapseNav()"
            >News</a
          >
        </li>
      </ul>
      <a
        href="https://registry.dome-ml.org/"
        target="_blank"
        rel="noopener"
        class="registry-link"
        title="Open the DOME Registry in a new tab"
        (click)="collapseNav()"
      >
        DOME Registry
        <i class="icon icon-common icon-external-link-alt" aria-hidden="true"></i>
      </a>
    </div>
  </nav>
</div>
