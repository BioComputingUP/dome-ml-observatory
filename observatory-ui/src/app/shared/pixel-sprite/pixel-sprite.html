<svg
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [attr.width]="pxWidth()"
  [attr.height]="pxHeight()"
  shape-rendering="crispEdges"
  aria-hidden="true"
  focusable="false"
>
  @for (r of rects(); track $index) {
    <rect [attr.x]="r.x" [attr.y]="r.y" [attr.width]="r.width" height="1" [attr.fill]="r.fill" />
  }
</svg>
