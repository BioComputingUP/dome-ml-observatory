<ul class="status-badges" aria-label="Record status">
  <li class="badge-chip" [class]="'tone-' + classificationTone()">{{ classificationLabel() }}</li>

  @if (openAccess()) {
    <li class="badge-chip tone-positive">Open access</li>
  } @else {
    <li class="badge-chip tone-neutral">Closed access</li>
  }

  @if (fulltext()) {
    <li class="badge-chip tone-neutral">Full text</li>
  }

  @if (enriched()) {
    <li class="badge-chip tone-positive">Enriched</li>
  } @else {
    <li class="badge-chip tone-neutral" title="The AI/ML enrichment pass has not run on this record yet">
      Not yet enriched
    </li>
  }
</ul>
