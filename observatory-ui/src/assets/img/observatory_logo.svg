<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-label="DOME Observatory">
  <title>DOME Observatory</title>

  <!-- Network/aperture mark: shared DOME-family node-graph motif, redrawn for a dark navbar
       background and Observatory's own accent colour rather than reusing OSAI's badge art. -->
  <g stroke="#cfe3ec" stroke-width="1" stroke-opacity="0.85" fill="none">
    <!-- outer ring -->
    <polygon points="67,40 59.09,59.09 40,67 20.91,59.09 13,40 20.91,20.91 40,13 59.09,20.91" />
    <!-- inner ring -->
    <polygon points="49.19,49.19 30.81,49.19 30.81,30.81 49.19,30.81" />
    <!-- spokes: outer to inner -->
    <line x1="67" y1="40" x2="49.19" y2="49.19" />
    <line x1="67" y1="40" x2="49.19" y2="30.81" />
    <line x1="59.09" y1="59.09" x2="49.19" y2="49.19" />
    <line x1="40" y1="67" x2="49.19" y2="49.19" />
    <line x1="40" y1="67" x2="30.81" y2="49.19" />
    <line x1="20.91" y1="59.09" x2="30.81" y2="49.19" />
    <line x1="13" y1="40" x2="30.81" y2="49.19" />
    <line x1="13" y1="40" x2="30.81" y2="30.81" />
    <line x1="20.91" y1="20.91" x2="30.81" y2="30.81" />
    <line x1="40" y1="13" x2="30.81" y2="30.81" />
    <line x1="40" y1="13" x2="49.19" y2="30.81" />
    <line x1="59.09" y1="20.91" x2="49.19" y2="30.81" />
    <!-- inner spokes to centre -->
    <line x1="40" y1="40" x2="49.19" y2="49.19" />
    <line x1="40" y1="40" x2="30.81" y2="49.19" />
    <line x1="40" y1="40" x2="30.81" y2="30.81" />
    <line x1="40" y1="40" x2="49.19" y2="30.81" />
  </g>

  <g>
    <circle cx="67" cy="40" r="2" fill="#cfe3ec" />
    <circle cx="59.09" cy="59.09" r="2" fill="#cfe3ec" />
    <circle cx="40" cy="67" r="2" fill="#cfe3ec" />
    <circle cx="20.91" cy="59.09" r="2" fill="#cfe3ec" />
    <circle cx="13" cy="40" r="2" fill="#cfe3ec" />
    <circle cx="20.91" cy="20.91" r="2" fill="#cfe3ec" />
    <circle cx="40" cy="13" r="2" fill="#cfe3ec" />
    <circle cx="59.09" cy="20.91" r="2" fill="#cfe3ec" />
    <circle cx="49.19" cy="49.19" r="2.25" fill="#f66729" />
    <circle cx="30.81" cy="49.19" r="2.25" fill="#cfe3ec" />
    <circle cx="30.81" cy="30.81" r="2.25" fill="#cfe3ec" />
    <circle cx="49.19" cy="30.81" r="2.25" fill="#cfe3ec" />
    <circle cx="40" cy="40" r="3" fill="#f66729" />
  </g>

  <!-- Wordmark -->
  <g font-family="'Lato', 'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="90" y="42" font-size="30" font-weight="700" letter-spacing="1">DOME</text>
    <text x="90" y="60" font-size="15" font-weight="500" letter-spacing="2.5" fill="#f66729">OBSERVATORY</text>
  </g>
</svg>
