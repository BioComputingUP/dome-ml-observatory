<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOME Observatory</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <!-- 400 for body text, 700 for existing bold headings/nav, 800 for the DOME wordmark --
         without these, browsers fall back to synthetic "faux bold", which looks noticeably worse
         at 800. Inter is gone: dome-ml.org (dome-ml-ui) actually loads and uses Lato, not Inter
         (the Registry declares Inter in SCSS but never links it as a webfont), so the brand
         wordmark now matches Observatory's own already-loaded body font instead of adding a
         second family. -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
