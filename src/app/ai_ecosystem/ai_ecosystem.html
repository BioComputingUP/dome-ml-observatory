<h2>AI Ecosystem</h2>

<!-- Filters -->
<div class="filters" style="margin-bottom: 25px; display: flex; gap: 25px;">
  <div>
    <label for="search">Search:  </label>
    <input
      type="text"
      id="search"
      [(ngModel)]="searchTerm"
      (ngModelChange)="applyFilters()"
      placeholder=" ..."
    />
  </div>
  <!-- Type Filter Removed -->
  <!-- Add Recommendation Filter Dropdown -->
  <div>
    <label for="recommendationFilter">Recommendation: </label>
    <select id="recommendationFilter" [(ngModel)]="selectedRecommendation" (ngModelChange)="applyFilters()">
      <option *ngFor="let rec of availableRecommendations" [value]="rec">{{ rec }}</option>
    </select>
  </div>
</div>

<!-- Results Table -->
<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <!-- Type Column Removed -->
      <th>Recommendation</th>
      <th>Relevance</th>
      <th>URL</th>
      <th>Bio.tools</th>
      <!-- Access Column Removed -->
    </tr>
  </thead>
  <tbody>
    <!-- Add a message if no data matches -->
    <tr *ngIf="filteredData.length === 0">
      <td colspan="6" style="text-align: center;">No items match the current filters.</td> <!-- Colspan updated to 6 -->
    </tr>
    <!-- Loop through filtered data -->
    <tr *ngFor="let item of filteredData">
      <td>{{ item.name || 'N/A' }}</td>
      <td>{{ item.description || 'N/A' }}</td>
      <!-- Type Cell Removed -->
      <td>{{ item['osai-recommendation'] || 'N/A' }}</td>
      <td>{{ item['osai-explanation'] || 'N/A' }}</td>
      <td>
        <a *ngIf="item.url" [href]="item.url" target="_blank" rel="noopener noreferrer">Link</a>
        <span *ngIf="!item.url">N/A</span>
      </td>
      <td>
        <a *ngIf="item['biotools-url']" [href]="item['biotools-url']" target="_blank" rel="noopener noreferrer">Bio.tools</a>
        <span *ngIf="!item['biotools-url']">N/A</span>
      </td>
      <!-- Access Cell Removed -->
    </tr>
  </tbody>
</table>
